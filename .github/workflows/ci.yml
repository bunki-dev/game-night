name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (engine, game master, WebSocket end-to-end)
        run: pytest -q
      - name: Offline evals
        run: python evals/run_evals.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gamenight:ci .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 gamenight:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/api/rooms | grep -q host_token
          curl -sf localhost:8000/ | grep -q "Game Night"
