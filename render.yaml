# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: game-night
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: offline # switch to anthropic or azure and add the key below
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
